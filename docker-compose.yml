# Локальный запуск: образы собираются из исходников.
# Запуск: docker compose up -d --build
# Сайт: http://localhost, pgAdmin: http://localhost:8080

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/igoral5/film-react-nest-frontend:latest
    container_name: film_frontend
    restart: unless-stopped
    networks:
      - webnet
    volumes:
      - frontend_dist:/app/dist

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/igoral5/film-react-nest-backend:latest
    container_name: film_backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    networks:
      - webnet

  database:
    image: postgres:16-alpine
    container_name: film_database
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./backend/test/prac.init.sql:/docker-entrypoint-initdb.d/01-tables.sql:ro
      - ./backend/test/prac.films.sql:/docker-entrypoint-initdb.d/02-films.sql:ro
      - ./backend/test/prac.shedules.sql:/docker-entrypoint-initdb.d/03-schedules.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webnet

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: film_pgadmin
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '8080:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - database
    networks:
      - webnet

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: ghcr.io/igoral5/film-react-nest-nginx:latest
    container_name: film_nginx
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/var/www/frontend:ro
    depends_on:
      - frontend
      - backend
    networks:
      - webnet

volumes:
  frontend_dist:
  pg_data:
  pgadmin_data:

networks:
  webnet:
