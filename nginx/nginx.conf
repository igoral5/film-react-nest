# Продакшен-конфиг: HTTPS с сертификатами Let's Encrypt и редирект с HTTP.

server {
    listen 80;
    listen [::]:80;
    server_name igoral.nomorepartiessite.ru;

    # Проверка домена для выпуска и продления сертификата.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name igoral.nomorepartiessite.ru;

    ssl_certificate /etc/letsencrypt/live/igoral.nomorepartiessite.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/igoral.nomorepartiessite.ru/privkey.pem;

    root /var/www/frontend;
    index index.html;

    # Роутинг SPA: любой путь отдаёт index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /content/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
